name: Playwright quality gates
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: playwright-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    # When promoting this subfolder to its own repository, change this to .
    working-directory: .
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:integration
  components:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: component-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: component-tests/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: component-report
          path: artifacts/component-report
  browsers:
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:all -- --grep-invert @visual --shard=${{ matrix.shard }}/2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blob-${{ matrix.shard }}
          path: blob-report
          retention-days: 14
  visual-windows:
    needs: quality
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npx playwright install chromium
      - run: npx playwright test tests/ui/visual.spec.ts --project=chromium
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-visual-results
          path: |
            playwright-report
            test-results
  merge-reports:
    if: always()
    needs: browsers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: blob-*
          path: all-blob-reports
          merge-multiple: true
      - run: npx playwright merge-reports --reporter html ./all-blob-reports
      - uses: actions/upload-artifact@v4
        with:
          name: merged-playwright-report
          path: playwright-report
          retention-days: 14

  cucumber:
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile: [default, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:bdd -- --profile ${{ matrix.profile }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cucumber-${{ matrix.profile }}
          path: artifacts/cucumber
          retention-days: 14
